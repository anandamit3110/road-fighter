<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Fighter Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000000; /* Set background color to black. */
        }
        canvas {
            border: 5px solid #000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #startButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #startButton:hover {
            background-color: #0056b3;
        }
        #pauseButton, #resumeButton {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Initially hidden */
        }
        #pauseButton:hover, #resumeButton:hover {
            background-color: #0056b3;
        }
        #stopMusicButton, #resumeMusicButton {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Initially hidden */
        }
        #stopMusicButton:hover, #resumeMusicButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="startButton">Start Game</button>
    <button id="pauseButton">Pause Game</button>
    <button id="resumeButton">Resume Game</button>
    <button id="stopMusicButton">Stop Music</button>
    <button id="resumeMusicButton">Resume Music</button>
    <script src="game.js"></script>
</body>
</html>
